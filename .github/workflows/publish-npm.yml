# 每次 push 到 main 时：若 package.json 的 version 在 npm 上尚未发布，则检查、测试、build 并 publish。
# 使用 npm Trusted Publishing（OIDC），不要在 GitHub 存 NPM_TOKEN。
#
# 第一个版本要在本机手动 npm publish（npm 只能给已存在的包配置 Trusted Publisher），之后在
# https://www.npmjs.com/package/pulsoicon → Settings → Trusted Publisher 添加：
#   Organization or user: CityPulso
#   Repository:            PulsoIcon
#   Workflow filename:     publish-npm.yml   （只要文件名，不要 .github/workflows/）
#   Environment:           留空（本 workflow 没有 environment:）
#   Allowed actions:       勾选 npm publish
#
# Publish on each main push when package.json version is not yet on npm.
# OIDC trusted publishing — no NPM_TOKEN secret. The first version is published by hand.

name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "src/**"
      - "tsconfig*.json"
      - ".github/workflows/publish-npm.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Get version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if version already published
        id: check
        run: |
          if npm view pulsoicon@${{ steps.pkg.outputs.version }} version 2>/dev/null; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      # Trusted publishing (OIDC) needs npm 11.5.1 or newer.
      - name: Update npm
        if: steps.check.outputs.published != 'true'
        run: npm install -g npm@latest

      - name: Install
        if: steps.check.outputs.published != 'true'
        run: npm ci

      # prepublishOnly runs typecheck, tests and build before the upload.
      - name: Publish to npm
        if: steps.check.outputs.published != 'true'
        run: npm publish
